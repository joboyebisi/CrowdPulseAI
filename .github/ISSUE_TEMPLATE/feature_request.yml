name: Feature request
description: Propose an improvement for creators or viewers
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: User problem
      description: Who has the problem, when does it occur, and why does it matter?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Desired experience
      description: Describe what the user should see and be able to do.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance criteria
      description: How will we know this works?
  - type: checkboxes
    attributes:
      label: Product guardrails
      options:
        - label: Preserves creator control
        - label: Avoids unlicensed sports media or data
        - label: Does not require gambling or cash-value rewards
