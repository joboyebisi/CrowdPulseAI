name: Bug report
description: Report reproducible CrowdPulse behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the shortest sequence that reproduces the issue.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Area
      options: [Pre-match, Twitch OAuth, EventSub, Clips, Dashboard, OBS overlay, Moment page, Other]
  - type: textarea
    attributes:
      label: Environment
      description: Browser, operating system, deployment, and relevant non-secret configuration.
