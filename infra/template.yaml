AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CrowdPulse serverless EventSub ingestion foundation

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        TABLE_NAME: !Ref CrowdPulseTable

Resources:
  CrowdPulseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byCreator
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  EventSubDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  EventSubQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventSubDeadLetterQueue.Arn
        maxReceiveCount: 4

  EventSubWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: HMAC secret used to verify Twitch EventSub webhooks
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  InternalApiSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Shared secret for authenticated Vercel-to-AWS requests
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  IntegrationSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: crowdpulse/integrations
      Description: Twitch and AI provider configuration for CrowdPulse Lambdas
      SecretString: "{}"

  TwitchGrantKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts durable Twitch creator grants
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Account administration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  CrowdPulseApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - https://crowd-pulse-ai-delta.vercel.app
        AllowHeaders: [content-type, x-crowdpulse-secret, twitch-eventsub-message-id, twitch-eventsub-message-signature, twitch-eventsub-message-timestamp, twitch-eventsub-message-type]
        AllowMethods: [GET, POST, OPTIONS]

  EventSubWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/eventsub/
      Handler: index.handler
      Environment:
        Variables:
          QUEUE_URL: !Ref EventSubQueue
          EVENTSUB_SECRET: !Sub "{{resolve:secretsmanager:${EventSubWebhookSecret}}}"
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref CrowdPulseTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EventSubQueue.QueueName
      Events:
        EventSubWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref CrowdPulseApi
            Path: /eventsub
            Method: POST

  EventSubProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/processor/
      Handler: index.handler
      Timeout: 60
      Environment:
        Variables:
          INTEGRATION_SECRET_ARN: !Ref IntegrationSecret
          KMS_KEY_ID: !Ref TwitchGrantKey
          HYPE_THRESHOLD: "5"
          HYPE_WINDOW_SECONDS: "20"
          HYPE_COOLDOWN_SECONDS: "90"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CrowdPulseTable
        - Statement:
            - Effect: Allow
              Action: [kms:Encrypt, kms:Decrypt]
              Resource: !GetAtt TwitchGrantKey.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref IntegrationSecret
      Events:
        EventSubQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt EventSubQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]

  CrowdPulseApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/api/
      Handler: index.handler
      Timeout: 30
      Environment:
        Variables:
          INTERNAL_API_SECRET: !Sub "{{resolve:secretsmanager:${InternalApiSecret}}}"
          INTEGRATION_SECRET_ARN: !Ref IntegrationSecret
          EVENTSUB_SECRET_ARN: !Ref EventSubWebhookSecret
          KMS_KEY_ID: !Ref TwitchGrantKey
          WEBHOOK_URL: !Sub "https://${CrowdPulseApi}.execute-api.${AWS::Region}.amazonaws.com/eventsub"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CrowdPulseTable
        - Statement:
            - Effect: Allow
              Action: [kms:Encrypt, kms:Decrypt]
              Resource: !GetAtt TwitchGrantKey.Arn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref IntegrationSecret
                - !Ref EventSubWebhookSecret
      Events:
        CreatorUpsert:
          Type: HttpApi
          Properties: { ApiId: !Ref CrowdPulseApi, Path: /internal/creators, Method: POST }
        CreatorRoomsList:
          Type: HttpApi
          Properties: { ApiId: !Ref CrowdPulseApi, Path: /internal/rooms, Method: GET }
        CreatorRoomsCreate:
          Type: HttpApi
          Properties: { ApiId: !Ref CrowdPulseApi, Path: /internal/rooms, Method: POST }
        CreatorRoomBrief:
          Type: HttpApi
          Properties: { ApiId: !Ref CrowdPulseApi, Path: /internal/rooms/{id}/brief, Method: GET }
        CreatorState:
          Type: HttpApi
          Properties: { ApiId: !Ref CrowdPulseApi, Path: /internal/state, Method: GET }
        CreatorMomentReview:
          Type: HttpApi
          Properties: { ApiId: !Ref CrowdPulseApi, Path: /internal/moments/{id}/review, Method: POST }
        PublicRoomGet:
          Type: HttpApi
          Properties: { ApiId: !Ref CrowdPulseApi, Path: /rooms/{id}, Method: GET }
        PublicRoomJoin:
          Type: HttpApi
          Properties: { ApiId: !Ref CrowdPulseApi, Path: /rooms/{id}/join, Method: POST }
        PublicMomentGet:
          Type: HttpApi
          Properties: { ApiId: !Ref CrowdPulseApi, Path: /moments/{id}, Method: GET }

Outputs:
  EventSubWebhookUrl:
    Value: !Sub "https://${CrowdPulseApi}.execute-api.${AWS::Region}.amazonaws.com/eventsub"
  TableName:
    Value: !Ref CrowdPulseTable
  WebhookSecretArn:
    Value: !Ref EventSubWebhookSecret
  ApiBaseUrl:
    Value: !Sub "https://${CrowdPulseApi}.execute-api.${AWS::Region}.amazonaws.com"
  InternalApiSecretArn:
    Value: !Ref InternalApiSecret
  IntegrationSecretArn:
    Value: !Ref IntegrationSecret
  TwitchGrantKeyArn:
    Value: !GetAtt TwitchGrantKey.Arn
